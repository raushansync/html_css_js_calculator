<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@15.2.0/lib/browser/math.min.js"></script>
    <script>
        function addLog(msg) {
            var ul = document.getElementById("log");
            var li = document.createElement("li");
            var msg_text_node = document.createTextNode(msg);
            li.appendChild(msg_text_node);
            ul.appendChild(li);
        }


        function calculate() {
            expression = document.getElementById("expression").value;
            if (expression) {
                try {
                    answer = eval(expression);
                    document.getElementById("expression").value = answer;
                    addLog(expression + " = " + answer)
                } catch (e) {
                    console.log("Bad Expression!");
                    addLog(expression + " is bad. Please fix it.")
                }
            }
        }

        function math_calculate() {
            expression = document.getElementById("expression").value;
            if (expression) {
                try {
                    answer = math.evaluate(expression);
                    document.getElementById("expression").value = answer;
                    addLog(expression + " = " + answer)
                } catch (e) {
                    console.log("Bad Expression!");
                    addLog(expression + " is bad. Please fix it.")
                }
            }
        }

        function initialize_app() {
            const calculate = document.getElementById("calculate");
            calculate.addEventListener('click', math_calculate);
        }

        function input_number(v) {
            expression = document.getElementById("expression").value;
            expression = expression + v;
            document.getElementById("expression").value = expression;
        }

        function input_operator(o) {
            expression = document.getElementById("expression").value;
            expression = expression + o;
            document.getElementById("expression").value = expression;            
        }
    </script>
    <style>
        * {padding: 4px;}
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <input type="input" class="form-control" id="expression" placeholder="3*5" />
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('7')">7</button>
                <button class="btn btn-primary" onclick="input_number('8')">8</button>
                <button class="btn btn-primary" onclick="input_number('9')">9</button>
                <button class="btn btn-warning" onclick="input_operator('/')">/</button>
            </div>
            <div class="col"></div>
        </div>
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('4')">4</button>
                <button class="btn btn-primary" onclick="input_number('5')">5</button>
                <button class="btn btn-primary" onclick="input_number('6')">6</button>
                <button class="btn btn-warning" onclick="input_operator('*')">*</button>                
            </div>
            <div class="col"></div>
        </div>
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('1')">1</button>
                <button class="btn btn-primary" onclick="input_number('2')">2</button>
                <button class="btn btn-primary" onclick="input_number('3')">3</button>
                <button class="btn btn-warning" onclick="input_operator('-')">-</button>                
            </div>
            <div class="col"></div>
        </div>
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('0')">0</button>
                <button class="btn btn-primary" onclick="input_number('.')">.</button>
                <button class="btn btn-success" id="calculate">=</button>
                <button class="btn btn-warning" onclick="input_operator('+')">+</button>                
            </div>
            <div class="col"></div>
        </div>
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <p><b>Logs:</b></p>
                <ul id="log"></ul>
            </div>
            <div class="col"></div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
<script>
    initialize_app();
</script>

</html>
